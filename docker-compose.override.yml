# Development additions, loaded automatically by `docker compose` (not when -f files are given, so never in production).
services:
  db:
    ports:
      # localhost only: lets dev.ps1 run the AI service and ingestion from the host
      - "127.0.0.1:${DB_PORT:-5434}:5432"

  portal:
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8082}:80"

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
