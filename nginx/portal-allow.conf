# Who may open the staff portal (PORTAL_HOST). Edit for RMB's network, then:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml restart nginx
#
# Default: private office / VPN address ranges. Add RMB's public office IP if staff reach the server
# through the internet, e.g.   allow 197.243.10.25;
#
# 172.16.0.0/12 is NOT allowed by default: Docker uses it internally, so allowing it could let everyone in.
# Check with `docker compose ... logs nginx` that real visitor addresses appear before allowing it.
allow 10.0.0.0/8;
allow 192.168.0.0/16;
deny all;
