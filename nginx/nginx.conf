# Public entry point. Only the public chat API is exposed; /api/v1/admin and the
# case service stay on the internal network (the admin portal reaches them directly).

limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;

# Resolve container names at request time (Docker DNS), so restarting a container never leaves nginx
# pointing at an old address (502 Bad Gateway).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Test page / mock RMB page with the widget
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location = /api/v1/chat {
        limit_req zone=chat burst=10 nodelay;
        set $ai_upstream http://ai:8000;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # Server-Sent Events: no buffering, long read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/v1/(cases|feedback|widget-config|health) {
        limit_req zone=chat burst=10 nodelay;
        set $ai_upstream http://ai:8000;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/admin { return 404; }
    location = /admin.html { return 404; }   # dev test page only
    location /docs { return 404; }
    location /openapi.json { return 404; }
}
