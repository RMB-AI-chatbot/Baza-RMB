<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RMB AI Assistant · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/assets/app.css?v=9">
<script src="/assets/i18n.js?v=9"></script>
<script src="/assets/heroicons.js?v=9"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/dashboard"><img src="/assets/rmb-logo.png" alt="" data-fallback="/assets/logo.svg">
      <div><b>RMB</b><small>Rwanda Mines, Petroleum<br>and Gas Board</small></div></a>
    <form class="search" id="search" role="search">
      <span data-hi="magnifying-glass" data-size="18"></span>
      <input id="searchInput" placeholder="Search conversations, staff, topics or knowledge..." aria-label="Search">
      <kbd>⌘K</kbd>
    </form>
    <div class="top-actions">
      <div class="lang-wrap"><button type="button" class="lang" id="langBtn" aria-haspopup="menu" aria-label="Language">EN</button>
        <div class="lang-menu" id="langMenu" role="menu" hidden></div></div>
      <button class="icon-btn" id="bell" title="Notifications" aria-label="Notifications"><span data-hi="bell" data-size="22"></span>
        <span class="badge" id="bellCount" hidden></span></button>
      <div class="notif" id="notif" hidden></div>
      <span class="avatar photo" id="topAvatar"></span>
    </div>
  </header>

  <aside class="sidebar">
    <nav id="nav" aria-label="Main"></nav>
    <div class="usercard">
      <span class="avatar light online" id="sideAvatar"></span>
      <div class="who"><b id="userName"></b><small id="userRole"></small></div>
      <form method="post" action="/logout" id="logoutForm"><input type="hidden" name="csrf" id="logoutCsrf">
        <button class="icon-btn light" title="Sign out" aria-label="Sign out"><span data-hi="arrow-right-start-on-rectangle" data-size="20"></span></button></form>
    </div>
  </aside>

  <main id="view" tabindex="-1"></main>

  <div class="drawer" id="drawer" hidden><div class="drawer-panel"><button class="icon-btn close" id="drawerClose" aria-label="Close"><span data-hi="x-mark" data-size="20"></span></button><div id="drawerBody"></div></div></div>
  <div class="modal" id="modal" hidden><div class="modal-card" id="modalBody"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/assets/fallback.js?v=9"></script>
  <script src="/assets/charts.js?v=9"></script>
  <script src="/assets/app.js?v=9"></script>
</body>
</html>
