<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>baza-RMB API test page</title>
<style>
  :root { --blue:#0b5e8e; --bg:#f4f6f9; --line:#dde3ea; }
  body { font-family: system-ui, sans-serif; margin:0; background:var(--bg); color:#1d2733; }
  header { background:var(--blue); color:#fff; padding:12px 20px; }
  header small { opacity:.8 }
  main { max-width:820px; margin:0 auto; padding:16px; }
  #log { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; min-height:300px; }
  .msg { margin:10px 0; line-height:1.5; white-space:pre-wrap; }
  .user { text-align:right; } .user span { background:var(--blue); color:#fff; padding:8px 12px; border-radius:12px; display:inline-block; max-width:80%; text-align:left; }
  .bot span.body { background:#eef3f8; padding:8px 12px; border-radius:12px; display:inline-block; max-width:90%; }
  .meta { font-size:12px; color:#6b7785; margin-top:4px; }
  .sources { font-size:13px; margin-top:6px; } .sources a { color:var(--blue); }
  .disclaimer { font-size:12px; color:#7a5a00; background:#fff7e0; padding:6px 8px; border-radius:6px; margin-top:6px; }
  .emergency { background:#fde8e8; border:1px solid #f5b5b5; padding:8px; border-radius:8px; margin-top:6px; }
  form.case { background:#fafbfc; border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:8px; }
  form.case label { display:block; font-size:13px; margin-top:6px; }
  form.case input, form.case textarea { width:100%; box-sizing:border-box; padding:6px; border:1px solid var(--line); border-radius:6px; }
  #ask { display:flex; gap:8px; margin-top:12px; }
  #ask input { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); }
  button { background:var(--blue); color:#fff; border:0; padding:8px 14px; border-radius:8px; cursor:pointer; }
  .chips button { background:#fff; color:var(--blue); border:1px solid var(--blue); margin:4px 4px 0 0; font-size:13px; }
</style>
</head>
<body>
<header><strong>baza-RMB</strong> &nbsp;<small>API test page for developers, not the production widget</small>
  <select id="lang" style="float:right" onchange="location.search='?lang='+this.value"><option value="en">English</option><option value="fr">Français</option><option value="rw">Kinyarwanda</option></select></header>
<main>
  <div class="chips" id="chips"></div>
  <div id="log"></div>
  <form id="ask"><input id="q" autocomplete="off" placeholder="Ask about licences, laws, royalties, geohazards…"><button>Send</button></form>
</main>
<script>
const API = location.port === "8000" ? "" : "";  // same origin (nginx proxies /api)
let sessionId = null;
const LANG = new URLSearchParams(location.search).get("lang") || "en";
document.getElementById("lang").value = LANG;
const log = document.getElementById("log");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

fetch(API + "/api/v1/widget-config?lang=" + LANG).then(r => r.json()).then(cfg => {
  addBot({answer: cfg.welcome_message});
  for (const s of cfg.suggestions) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = s;
    b.onclick = () => send(s); document.getElementById("chips").appendChild(b);
  }
}).catch(() => {});

function addUser(text) {
  const d = document.createElement("div"); d.className = "msg user";
  d.innerHTML = `<span>${esc(text)}</span>`; log.appendChild(d);
}
function addBot(r, el) {
  el = el || Object.assign(document.createElement("div"), {className: "msg bot"});
  let html = `<span class="body">${esc(r.answer || "").replace(/\[(\d+)\]/g, "<sup>[$1]</sup>")}</span>`;
  if (r.notice) html += `<div class="meta">${esc(r.notice)}</div>`;
  if (r.emergency_contacts) html += `<div class="emergency"><strong>Emergency contacts</strong><br>` +
      r.emergency_contacts.map(c => `${esc(c.label)}: <strong>${esc(c.value)}</strong>`).join("<br>") + `</div>`;
  if (r.sources && r.sources.length) html += `<div class="sources"><strong>Sources</strong><br>` +
      r.sources.map(s => `[${s.n}] ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">` : ""}${esc(s.short_title)}${s.section ? ", " + esc(s.section) : ""}${s.page ? ", p. " + esc(s.page) : ""}${s.url ? "</a>" : ""}`).join("<br>") + `</div>`;
  if (r.disclaimer) html += `<div class="disclaimer">${esc(r.disclaimer)}</div>`;
  if (r.intent) html += `<div class="meta">intent: ${r.intent} · category: ${r.category} · action: ${r.action}</div>`;
  el.innerHTML = html;
  if (r.form) el.appendChild(renderForm(r.form));
  if (!el.parentNode) log.appendChild(el);
  el.scrollIntoView({block: "end"});
  return el;
}
function renderForm(f) {
  const form = document.createElement("form"); form.className = "case";
  form.innerHTML = `<strong>${esc(f.title)}</strong>` +
    (f.anonymous_allowed ? `<label><input type="checkbox" name="__anon" ${f.anonymous_default ? "checked" : ""} style="width:auto"> Stay anonymous</label>` : "") +
    f.fields.map(x => `<label>${esc(x.label)}${x.required ? " *" : ""}${x.type === "textarea"
       ? `<textarea name="${x.name}" rows="3">${esc(f.prefill[x.name] || "")}</textarea>`
       : `<input name="${x.name}" type="${x.type === "tel" ? "tel" : x.type}" value="${esc(f.prefill[x.name] || "")}">`}</label>`).join("") +
    `<br><button>${f.lookup ? "Check status" : "Submit"}</button><div class="meta result"></div>`;
  form.onsubmit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form)); const anon = !!data.__anon; delete data.__anon;
    for (const k in data) if (data[k] === "") delete data[k];
    const out = form.querySelector(".result");
    try {
      let r;
      if (f.lookup) r = await fetch(`${API}/api/v1/cases/${encodeURIComponent(data.reference || "")}`);
      else r = await fetch(API + "/api/v1/cases", {method: "POST", headers: {"Content-Type": "application/json"},
               body: JSON.stringify({session_id: sessionId, type: f.type, fields: data, anonymous: anon})});
      const j = await r.json();
      out.textContent = r.ok ? (j.message || `Status: ${j.status} (routed to ${j.routed_to})`) : (j.detail || "Error");
    } catch (err) { out.textContent = "Network error"; }
  };
  return form;
}
async function send(text) {
  addUser(text);
  const el = addBot({answer: "…"});
  const res = await fetch(API + "/api/v1/chat", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: sessionId, message: text, language: LANG, stream: true})});
  if (!res.ok) { const j = await res.json().catch(() => ({})); addBot({answer: j.detail || "Error"}, el); return; }
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "", answer = "";
  for (;;) {
    const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream: true});
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = (raw.match(/^event: (.*)$/m) || [])[1]; const data = JSON.parse((raw.match(/^data: (.*)$/m) || [])[1] || "{}");
      if (ev === "meta") sessionId = data.session_id;
      if (ev === "delta") { answer += data.text; addBot({answer}, el); }
      if (ev === "final") { sessionId = data.session_id; addBot(data, el); }
      if (ev === "error") addBot({answer: data.message}, el);
    }
  }
}
document.getElementById("ask").onsubmit = e => { e.preventDefault(); const q = document.getElementById("q"); if (q.value.trim()) { send(q.value.trim()); q.value = ""; } };
</script>
</body>
</html>
