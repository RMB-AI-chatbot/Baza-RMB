[project]
name = "baza-rmb-ai"
version = "0.1.0"
description = "baza-RMB AI service: RAG chat API for the Rwanda Mines, Petroleum and Gas Board"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "anthropic>=1.0",
  "google-genai>=1.0",
  "groq>=0.11",
  "fastembed>=0.4",
  "pymupdf>=1.24",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
