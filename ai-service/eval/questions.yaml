  - id: e18
    q: Umusoro ku mabuye y'agaciro ungana ute?
    expect: {type: answer, sources: [[law-056-2024-mineral-tax, art-4]]}
  - id: e19
    q: Uruhushya rw'ubucukuzi rumara igihe kingana iki?
